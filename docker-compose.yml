services:
  postgres:
    image: postgres:16-alpine
    container_name: careerhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: careerhub
    ports:
      - "5432:5432"
    volumes:
      - careerhub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d careerhub"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  careerhub_pgdata:
